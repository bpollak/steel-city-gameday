<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crew invite · Steel City Gameday</title>
  <meta name="description" content="Join a private Crew in Steel City Gameday.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#08090b">
  <link rel="canonical" href="https://steelcitygameday.com/join/">
  <link rel="icon" href="../assets/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/static-page.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Site navigation">
      <a class="brand" href="../" aria-label="Steel City Gameday home">
        <img src="../assets/icon.png" alt="" width="34" height="34">
        <span>Steel City <strong>Gameday</strong></span>
      </a>
      <a class="back-link" href="../">Back to home</a>
    </nav>
  </header>

  <main class="get-page" aria-live="polite">
    <p class="eyebrow">Private Crew invite</p>
    <h1 id="title">You're invited.</h1>
    <p class="lede" id="message">Checking this Crew invite…</p>

    <section class="invite-card" id="game-card" hidden>
      <h2>Next game</h2>
      <p id="game"></p>
    </section>

    <div class="invite-actions">
      <a class="cta" id="open-app" href="https://steelcitygameday.com/get/">Open in the app</a>
      <a class="secondary-action" href="https://steelcitygameday.com/get/">Get Steel City Gameday</a>
    </div>
    <p class="legal-note">An independent, unofficial fan app. Not affiliated with or endorsed by the Pittsburgh Steelers or the NFL. No wagering.</p>
  </main>

  <footer>© 2026 Steel City Gameday</footer>

  <script>
    (() => {
      const token = new URLSearchParams(window.location.search).get("token") || "";
      const validToken = /^[A-Za-z0-9_-]{16,128}$/.test(token);
      const title = document.querySelector("#title");
      const message = document.querySelector("#message");
      const openApp = document.querySelector("#open-app");

      let fallbackTimer;
      const clearFallback = () => window.clearTimeout(fallbackTimer);
      window.addEventListener("pagehide", clearFallback);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) clearFallback();
      });
      openApp.addEventListener("click", (event) => {
        const appURL = openApp.dataset.appUrl;
        if (!appURL) return;
        event.preventDefault();
        fallbackTimer = window.setTimeout(() => {
          window.location.assign("https://steelcitygameday.com/get/");
        }, 1200);
        window.location.assign(appURL);
      });

      if (!validToken) {
        title.textContent = "This invite isn't valid.";
        message.textContent = "Ask the Crew owner for a fresh Steel City Gameday invite.";
        openApp.textContent = "Back to Steel City Gameday";
        openApp.href = "https://steelcitygameday.com/";
        return;
      }

      const canonicalInviteURL = new URL("https://steelcitygameday.com/join/");
      canonicalInviteURL.searchParams.set("token", token);
      openApp.href = canonicalInviteURL.toString();
      openApp.dataset.appUrl = `steelcity://join/${encodeURIComponent(token)}`;
      const previewEndpoint = new URL("https://steel-city-gameday.vercel.app/api/v1/invites/preview");
      previewEndpoint.searchParams.set("token", token);

      fetch(previewEndpoint, { headers: { Accept: "application/json" } })
        .then((response) => response.ok ? response.json() : Promise.reject(new Error("invite unavailable")))
        .then(({ data }) => {
          if (!data || typeof data.crew_name !== "string") throw new Error("invalid preview");
          title.textContent = `Join ${data.crew_name}`;
          const count = Number(data.member_count) || 0;
          message.textContent = count === 1
            ? "One member is already in this private Crew. Open the app to join them."
            : `${count} members are already in this private Crew. Open the app to join them.`;

          if (data.next_game && typeof data.next_game.opponent === "string") {
            const gameCard = document.querySelector("#game-card");
            const game = document.querySelector("#game");
            const homeAway = data.next_game.home_away === "home" ? "vs." : "at";
            const kickoff = new Date(data.next_game.kickoff_at);
            const when = Number.isNaN(kickoff.getTime())
              ? "Kickoff time coming soon"
              : kickoff.toLocaleString("en-US", {
                  weekday: "short",
                  month: "short",
                  day: "numeric",
                  hour: "numeric",
                  minute: "2-digit",
                  timeZoneName: "short",
                });
            game.textContent = `Week ${data.next_game.week} ${homeAway} ${data.next_game.opponent} · ${when}`;
            gameCard.hidden = false;
          }
        })
        .catch(() => {
          title.textContent = "Open your Crew invite.";
          message.textContent = "Open Steel City Gameday to accept this invite. If it has expired, ask the Crew owner for a fresh link.";
        });
    })();
  </script>
</body>
</html>
